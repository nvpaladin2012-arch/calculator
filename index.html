<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Онлайн-калькулятор</title>
  <meta name="theme-color" content="#4f46e5" />
  <meta
    name="description"
    content="Простой онлайн-калькулятор: расчёт по формуле (Переменная 1 × ставка) / 365 × Переменная 2 со ставкой 2,3% или 2,1%."
  />
  <meta property="og:title" content="Онлайн-калькулятор" />
  <meta
    property="og:description"
    content="Быстрый расчёт по формуле с выбором ставки 2,3% или 2,1%."
  />
  <meta property="og:type" content="website" />
  <!-- Иконка для вкладки и плитки в визуальных закладках -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>" />
  <style>
    /* ---------- Базовые настройки ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #eef2ff;
      --bg-2: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --success: #059669;
      --shadow: 0 20px 45px -20px rgba(15, 23, 42, 0.25);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #e0e7ff 0%, transparent 45%),
                  linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Карточка калькулятора ---------- */
    .calculator {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .calculator__title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .calculator__subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .calculator__formula {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 8px;
    }

    /* ---------- Выбор варианта расчёта ---------- */
    .rate {
      margin: 0 0 20px;
      padding: 0;
      border: none;
    }

    .rate__legend {
      padding: 0;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .rate__options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: #f1f5f9;
      border-radius: 12px;
    }

    .rate__option {
      position: relative;
    }

    .rate__radio {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .rate__label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 9px 8px;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .rate__label small {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.75;
    }

    .rate__label:hover {
      color: var(--text);
    }

    .rate__radio:checked + .rate__label {
      color: var(--accent);
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
    }

    .rate__radio:focus-visible + .rate__label {
      outline: 3px solid rgba(79, 70, 229, 0.35);
      outline-offset: 2px;
    }

    /* ---------- Поля ввода ---------- */
    .field {
      margin-bottom: 18px;
    }

    .field__label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .field__input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .field__input::placeholder {
      color: #94a3b8;
    }

    .field__input:hover {
      border-color: #cbd5e1;
    }

    .field__input:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.14);
    }

    /* Убираем стрелки у числовых полей */
    .field__input::-webkit-outer-spin-button,
    .field__input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field__input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* ---------- Кнопка ---------- */
    .calculator__button {
      width: 100%;
      padding: 15px 20px;
      margin-top: 6px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 22px -10px rgba(79, 70, 229, 0.8);
    }

    .calculator__button:hover {
      filter: brightness(1.05);
      box-shadow: 0 14px 26px -10px rgba(79, 70, 229, 0.9);
    }

    .calculator__button:active {
      transform: translateY(1px) scale(0.995);
    }

    .calculator__button:focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.4);
      outline-offset: 2px;
    }

    /* ---------- Блок результата ---------- */
    .result {
      margin-top: 24px;
      padding: 20px;
      background: #f8fafc;
      border: 1.5px dashed var(--border);
      border-radius: 16px;
      text-align: center;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .result--active {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .result--error {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .result__label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .result__value {
      display: block;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--success);
      word-break: break-word;
      transition: color 0.25s ease;
    }

    .result__value--empty {
      color: #cbd5e1;
      font-weight: 600;
    }

    .result--error .result__value {
      font-size: 1rem;
      font-weight: 500;
      color: #dc2626;
    }

    /* ---------- Мобильная адаптация ---------- */
    @media (max-width: 480px) {
      .calculator {
        padding: 24px 20px;
        border-radius: 20px;
      }

      .calculator__title {
        font-size: 1.3rem;
      }

      .result__value {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1 class="calculator__title">Онлайн-калькулятор</h1>
    <p class="calculator__subtitle">
      Расчёт по формуле:
      <span class="calculator__formula" id="formulaText">(Переменная 1 × 0.023) / 365 × Переменная 2</span>
    </p>

    <form class="calculator__form" id="calcForm" novalidate>
      <fieldset class="rate">
        <legend class="rate__legend">Вариант расчёта</legend>
        <div class="rate__options">
          <div class="rate__option">
            <input class="rate__radio" type="radio" name="rate" id="rate23" value="0.023" checked />
            <label class="rate__label" for="rate23">
              2,3 %
              <small>0.023</small>
            </label>
          </div>
          <div class="rate__option">
            <input class="rate__radio" type="radio" name="rate" id="rate21" value="0.021" />
            <label class="rate__label" for="rate21">
              2,1 %
              <small>0.021</small>
            </label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label class="field__label" for="var1">Переменная 1</label>
        <input
          class="field__input"
          type="number"
          id="var1"
          name="var1"
          placeholder="Например, 100000"
          step="any"
          inputmode="decimal"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label class="field__label" for="var2">Переменная 2</label>
        <input
          class="field__input"
          type="number"
          id="var2"
          name="var2"
          placeholder="Например, 30"
          step="any"
          inputmode="decimal"
          autocomplete="off"
        />
      </div>

      <button class="calculator__button" type="submit">Рассчитать</button>
    </form>

    <div class="result" id="result" aria-live="polite">
      <span class="result__label" id="resultLabel">Результат</span>
      <span class="result__value result__value--empty" id="resultValue">—</span>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      // Получаем ссылки на элементы интерфейса
      const form = document.getElementById("calcForm");
      const input1 = document.getElementById("var1");
      const input2 = document.getElementById("var2");
      const resultBox = document.getElementById("result");
      const resultValue = document.getElementById("resultValue");
      const resultLabel = document.getElementById("resultLabel");
      const formulaText = document.getElementById("formulaText");
      const rateRadios = document.querySelectorAll('input[name="rate"]');

      /**
       * Форматирует число для вывода:
       * - разделяет тысячи пробелом;
       * - оставляет до 6 знаков после запятой;
       * - убирает лишние нули в конце.
       */
      function formatNumber(value) {
        if (!isFinite(value)) return "—";

        return new Intl.NumberFormat("ru-RU", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 6,
        }).format(value);
      }

      /**
       * Показывает состояние ошибки в блоке результата.
       */
      function showError(message) {
        resultBox.classList.remove("result--active");
        resultBox.classList.add("result--error");
        resultValue.classList.remove("result__value--empty");
        resultValue.textContent = message;
      }

      /**
       * Возвращает выбранную ставку в долях единицы:
       * 0.023 для варианта 2,3% и 0.021 для варианта 2,1%.
       */
      function getSelectedRate() {
        const checked = document.querySelector('input[name="rate"]:checked');
        return checked ? parseFloat(checked.value) : 0.023;
      }

      /**
       * Переводит ставку из долей в проценты для подписи результата:
       * 0.023 -> "2,3", 0.021 -> "2,1".
       */
      function formatRatePercent(rate) {
        return (rate * 100).toLocaleString("ru-RU", {
          maximumFractionDigits: 2,
        });
      }

      /**
       * Сбрасывает блок результата в исходное состояние.
       */
      function resetResult() {
        resultBox.classList.remove("result--active", "result--error");
        resultValue.classList.add("result__value--empty");
        resultValue.textContent = "—";
        resultLabel.textContent = "Результат";
      }

      /**
       * Обновляет текст формулы под выбранный вариант расчёта.
       */
      function updateFormula() {
        formulaText.textContent =
          "(Переменная 1 × " + getSelectedRate() + ") / 365 × Переменная 2";
      }

      /**
       * Выполняет расчёт по одной из двух формул:
       *
       *   Вариант 1: Результат = (Переменная_1 * 2.3%) / 365 * Переменная_2
       *   Вариант 2: Результат = (Переменная_1 * 2.1%) / 365 * Переменная_2
       *
       * Проценты переводим в доли единицы:
       *   2.3% = 2.3 / 100 = 0.023
       *   2.1% = 2.1 / 100 = 0.021
       * Делим на 365, чтобы получить значение за один день
       * (если Переменная_2 — количество дней).
       */
      function calculate(event) {
        event.preventDefault();

        // Считываем значения и заменяем запятую на точку (для удобства ввода)
        const raw1 = input1.value.replace(",", ".").trim();
        const raw2 = input2.value.replace(",", ".").trim();

        // Проверяем, что оба поля заполнены
        if (raw1 === "" || raw2 === "") {
          showError("Заполните оба поля");
          return;
        }

        const var1 = Number(raw1);
        const var2 = Number(raw2);

        // Проверяем, что введены корректные числа
        if (!isFinite(var1) || !isFinite(var2)) {
          showError("Введите корректные числа");
          return;
        }

        // ---------- Основная формула ----------
        const percentRate = getSelectedRate(); // 0.023 (2,3%) или 0.021 (2,1%)
        const daysInYear = 365;                // количество дней в году

        const dailyValue = (var1 * percentRate) / daysInYear; // значение за 1 день
        const result = dailyValue * var2;                      // итог за Переменная_2 дней

        // ---------- Вывод результата ----------
        resultBox.classList.remove("result--error");
        resultBox.classList.add("result--active");
        resultValue.classList.remove("result__value--empty");
        resultValue.textContent = formatNumber(result);
        resultLabel.textContent =
          "Результат · " + formatRatePercent(percentRate) + " %";
      }

      // Запускаем расчёт при отправке формы (клик по кнопке или Enter)
      form.addEventListener("submit", calculate);

      // При смене варианта обновляем формулу и сбрасываем старый результат
      rateRadios.forEach(function (radio) {
        radio.addEventListener("change", function () {
          updateFormula();
          resetResult();
        });
      });

      // Сбрасываем результат, если пользователь меняет данные
      [input1, input2].forEach(function (input) {
        input.addEventListener("input", resetResult);
      });
    })();
  </script>
</body>
</html>
