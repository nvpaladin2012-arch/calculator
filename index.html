<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Онлайн-калькулятор</title>
  <meta name="theme-color" content="#a5b4fc" />
  <meta
    name="description"
    content="Онлайн-калькулятор: расчёт по формуле (Переменная 1 × ставка) / 365 × дни. Дни вычисляются автоматически по дате окончания. Ставка 2,3%."
  />
  <meta property="og:title" content="Онлайн-калькулятор" />
  <meta
    property="og:description"
    content="Расчёт по формуле с автоматическим подсчётом дней по дате окончания. Ставка 2,3%."
  />
  <meta property="og:type" content="website" />
  <!-- Иконка для вкладки и плитки в визуальных закладках -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>" />
  <style>
    /* ---------- Базовые настройки ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #1e1b4b;
      --muted: #5b5b7a;
      --accent: #4f46e5;
      --accent-2: #7c3aed;
      --success: #047857;
      --danger: #be123c;
      --glass-border: rgba(255, 255, 255, 0.65);
      --shadow: 0 30px 70px -30px rgba(49, 46, 129, 0.45);
    }

    html {
      min-height: 100%;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(60% 55% at 12% 8%, rgba(165, 180, 252, 0.85) 0%, transparent 70%),
        radial-gradient(50% 50% at 88% 12%, rgba(251, 207, 232, 0.8) 0%, transparent 70%),
        radial-gradient(55% 60% at 78% 88%, rgba(153, 246, 228, 0.55) 0%, transparent 70%),
        radial-gradient(45% 45% at 18% 92%, rgba(196, 181, 253, 0.7) 0%, transparent 70%),
        linear-gradient(150deg, #eef2ff 0%, #f5f3ff 38%, #fdf2f8 68%, #ecfeff 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Мягкие светящиеся пятна на фоне */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
      z-index: 0;
    }

    body::before {
      width: 340px;
      height: 340px;
      top: -120px;
      left: -80px;
      background: rgba(129, 140, 248, 0.45);
    }

    body::after {
      width: 300px;
      height: 300px;
      right: -70px;
      bottom: -120px;
      background: rgba(244, 114, 182, 0.35);
    }

    /* ---------- Стеклянная карточка калькулятора ---------- */
    .calculator {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      padding: 34px 32px 30px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.34));
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 -1px 0 rgba(255, 255, 255, 0.25);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      backdrop-filter: blur(26px) saturate(160%);
      animation: fadeUp 0.55s ease both;
    }

    /* Верхний блик на стекле */
    .calculator::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, 0.7), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .calculator > * {
      position: relative;
      z-index: 1;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .calculator__title {
      margin-bottom: 8px;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(120deg, #312e81 0%, #6d28d9 55%, #4f46e5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .calculator__subtitle {
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .calculator__formula {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 12px;
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
      font-size: 0.78rem;
      color: #4338ca;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 4px 12px -8px rgba(49, 46, 129, 0.5);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .calculator__note {
      display: block;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
    }

    /* ---------- Поля ввода ---------- */
    .field {
      margin-bottom: 18px;
    }

    .field__label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .field__input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 14px;
      outline: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 6px 16px -12px rgba(49, 46, 129, 0.4);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .field__input::placeholder {
      color: rgba(91, 91, 122, 0.55);
    }

    .field__input:hover {
      background: rgba(255, 255, 255, 0.6);
      border-color: rgba(255, 255, 255, 0.95);
    }

    .field__input:focus {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(99, 102, 241, 0.55);
      box-shadow:
        0 0 0 4px rgba(99, 102, 241, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Убираем стрелки у числовых полей */
    .field__input::-webkit-outer-spin-button,
    .field__input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field__input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .field__input[type="date"] {
      color-scheme: light;
    }

    .field__hint {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .field__hint--ok {
      color: #4338ca;
    }

    .field__hint--error {
      color: var(--danger);
    }

    /* ---------- Кнопка ---------- */
    .calculator__button {
      width: 100%;
      padding: 15px 20px;
      margin-top: 6px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #7c3aed 55%, #8b5cf6 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      cursor: pointer;
      box-shadow:
        0 16px 30px -14px rgba(79, 70, 229, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .calculator__button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow:
        0 20px 34px -14px rgba(79, 70, 229, 1),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .calculator__button:active {
      transform: translateY(0) scale(0.995);
    }

    .calculator__button:focus-visible {
      outline: 3px solid rgba(99, 102, 241, 0.4);
      outline-offset: 2px;
    }

    /* ---------- Стеклянный блок результата ---------- */
    .result {
      margin-top: 24px;
      padding: 20px 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .result--active {
      background: linear-gradient(150deg, rgba(209, 250, 229, 0.65), rgba(236, 253, 245, 0.4));
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 12px 28px -18px rgba(5, 150, 105, 0.6);
    }

    .result--error {
      background: linear-gradient(150deg, rgba(254, 226, 226, 0.7), rgba(255, 241, 242, 0.45));
      border-color: rgba(244, 63, 94, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .result__label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(49, 46, 129, 0.55);
    }

    .result__value {
      display: block;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--success);
      word-break: break-word;
      transition: color 0.25s ease;
    }

    .result__value--empty {
      font-weight: 600;
      color: rgba(91, 91, 122, 0.35);
    }

    .result--error .result__value {
      font-size: 1rem;
      font-weight: 500;
      color: var(--danger);
    }

    /* ---------- Фолбэк без backdrop-filter ---------- */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .calculator {
        background: rgba(255, 255, 255, 0.82);
      }

      .field__input {
        background: rgba(255, 255, 255, 0.85);
      }

      .result {
        background: rgba(255, 255, 255, 0.7);
      }
    }

    /* ---------- Мобильная адаптация ---------- */
    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .calculator {
        padding: 26px 20px 22px;
        border-radius: 22px;
      }

      .calculator__title {
        font-size: 1.3rem;
      }

      .result__value {
        font-size: 1.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .calculator {
        animation: none;
      }

      .calculator__button,
      .field__input,
      .result {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1 class="calculator__title">Онлайн-калькулятор</h1>
    <p class="calculator__subtitle">
      Расчёт по формуле:
      <span class="calculator__formula" id="formulaText">(Переменная 1 × 0.023) / 365 × Переменная 2</span>
      <span class="calculator__note">
        Переменная 2 — количество дней от сегодняшней даты до даты окончания.
        Ставка фиксированная — 2,3 %.
      </span>
    </p>

    <form class="calculator__form" id="calcForm" novalidate>
      <div class="field">
        <label class="field__label" for="var1">Переменная 1</label>
        <input
          class="field__input"
          type="number"
          id="var1"
          name="var1"
          placeholder="Например, 100000"
          step="any"
          inputmode="decimal"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label class="field__label" for="endDate">Дата окончания</label>
        <input
          class="field__input"
          type="date"
          id="endDate"
          name="endDate"
        />
        <p class="field__hint" id="daysHint">Выберите дату окончания</p>
      </div>

      <button class="calculator__button" type="submit">Рассчитать</button>
    </form>

    <div class="result" id="result" aria-live="polite">
      <span class="result__label" id="resultLabel">Результат</span>
      <span class="result__value result__value--empty" id="resultValue">—</span>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      // Получаем ссылки на элементы интерфейса
      const form = document.getElementById("calcForm");
      const input1 = document.getElementById("var1");
      const endDateInput = document.getElementById("endDate");
      const daysHint = document.getElementById("daysHint");
      const resultBox = document.getElementById("result");
      const resultValue = document.getElementById("resultValue");
      const resultLabel = document.getElementById("resultLabel");

      const MS_PER_DAY = 24 * 60 * 60 * 1000;

      // Фиксированная ставка: 2,3 % = 2.3 / 100 = 0.023
      const RATE = 0.023;
      const RATE_LABEL = "2,3 %";

      /**
       * Возвращает сегодняшнюю дату, обнуляя время.
       * Так разница между датами считается ровно в календарных днях.
       */
      function todayAtMidnight() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
      }

      /**
       * Разбирает значение input[type="date"] ("YYYY-MM-DD")
       * как локальную дату, а не UTC.
       */
      function parseDateInput(value) {
        if (!value) return null;

        const parts = value.split("-").map(Number);
        if (
          parts.length !== 3 ||
          parts.some(function (part) {
            return !isFinite(part);
          })
        ) {
          return null;
        }

        const date = new Date(parts[0], parts[1] - 1, parts[2]);

        // Проверяем, что дата не «перекатилась» (например, 31.02)
        if (
          date.getFullYear() !== parts[0] ||
          date.getMonth() !== parts[1] - 1 ||
          date.getDate() !== parts[2]
        ) {
          return null;
        }

        return date;
      }

      /**
       * Преобразует дату в строку "YYYY-MM-DD" для атрибута min.
       */
      function toISODate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      }

      /**
       * Форматирует дату для подсказки: 31.01.2027.
       */
      function formatDate(date) {
        return new Intl.DateTimeFormat("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(date);
      }

      /**
       * Считает количество календарных дней между датами.
       */
      function daysBetween(start, end) {
        return Math.round((end - start) / MS_PER_DAY);
      }

      /**
       * Склоняет слово «день»: 1 день, 2 дня, 5 дней.
       */
      function pluralDays(value) {
        const abs = Math.abs(value) % 100;
        const last = abs % 10;

        if (abs > 10 && abs < 20) return "дней";
        if (last === 1) return "день";
        if (last >= 2 && last <= 4) return "дня";
        return "дней";
      }

      /**
       * Форматирует число для вывода:
       * - разделяет тысячи пробелом;
       * - оставляет до 6 знаков после запятой;
       * - убирает лишние нули в конце.
       */
      function formatNumber(value) {
        if (!isFinite(value)) return "—";

        return new Intl.NumberFormat("ru-RU", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 6,
        }).format(value);
      }

      /**
       * Показывает состояние ошибки в блоке результата.
       */
      function showError(message) {
        resultBox.classList.remove("result--active");
        resultBox.classList.add("result--error");
        resultValue.classList.remove("result__value--empty");
        resultValue.textContent = message;
      }

      /**
       * Сбрасывает блок результата в исходное состояние.
       */
      function resetResult() {
        resultBox.classList.remove("result--active", "result--error");
        resultValue.classList.add("result__value--empty");
        resultValue.textContent = "—";
        resultLabel.textContent = "Результат";
      }

      /**
       * Обновляет подсказку под датой окончания.
       * Дни считаются от сегодняшней даты до выбранной даты.
       */
      function updateDaysHint() {
        const endDate = parseDateInput(endDateInput.value);
        daysHint.classList.remove("field__hint--ok", "field__hint--error");

        if (!endDate) {
          daysHint.textContent = "Выберите дату окончания";
          return;
        }

        const today = todayAtMidnight();
        const days = daysBetween(today, endDate);

        if (days <= 0) {
          daysHint.classList.add("field__hint--error");
          daysHint.textContent = "Дата окончания должна быть позже сегодняшней";
          return;
        }

        daysHint.classList.add("field__hint--ok");
        daysHint.textContent =
          "Период: " +
          formatDate(today) +
          " — " +
          formatDate(endDate) +
          " · " +
          days +
          " " +
          pluralDays(days);
      }

      /**
       * Выполняет расчёт по формуле:
       *
       *   Результат = (Переменная_1 × ставка) / 365 × дни
       *
       * Ставка фиксированная:
       *   2,3% = 2.3 / 100 = 0.023
       *
       * Дни вычисляются автоматически как разница между
       * сегодняшней датой и датой окончания, которую ввёл пользователь.
       * Делим на 365, чтобы получить значение за один день.
       */
      function calculate(event) {
        event.preventDefault();

        // Считываем сумму и заменяем запятую на точку
        const raw1 = input1.value.replace(",", ".").trim();

        if (raw1 === "") {
          showError("Введите Переменную 1");
          return;
        }

        const var1 = Number(raw1);
        if (!isFinite(var1)) {
          showError("Введите корректное число");
          return;
        }

        const endDate = parseDateInput(endDateInput.value);
        if (!endDate) {
          showError("Выберите дату окончания");
          return;
        }

        // ---------- Автоматический расчёт дней ----------
        const today = todayAtMidnight();
        const days = daysBetween(today, endDate);

        if (days <= 0) {
          showError("Дата окончания должна быть позже сегодняшней");
          return;
        }

        // ---------- Основная формула ----------
        const daysInYear = 365; // количество дней в году

        const dailyValue = (var1 * RATE) / daysInYear; // значение за 1 день
        const result = dailyValue * days;              // итог за выбранное количество дней

        // ---------- Вывод результата ----------
        resultBox.classList.remove("result--error");
        resultBox.classList.add("result--active");
        resultValue.classList.remove("result__value--empty");
        resultValue.textContent = formatNumber(result);
        resultLabel.textContent =
          "Результат · " + RATE_LABEL + " · " + days + " " + pluralDays(days);
      }

      // Минимальная дата окончания — завтра
      const today = todayAtMidnight();
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      endDateInput.min = toISODate(tomorrow);

      // Запускаем расчёт при отправке формы (клик по кнопке или Enter)
      form.addEventListener("submit", calculate);

      // Сбрасываем результат и обновляем подсказку при изменении данных
      input1.addEventListener("input", resetResult);

      endDateInput.addEventListener("input", function () {
        updateDaysHint();
        resetResult();
      });

      endDateInput.addEventListener("change", function () {
        updateDaysHint();
        resetResult();
      });

      // Инициализация
      updateDaysHint();
    })();
  </script>
</body>
</html>
